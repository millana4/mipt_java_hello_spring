name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show Java version
        run: java -version

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Show test status
        if: always()
        run: |
          echo "Build and tests finished with status: ${{ job.status }}"
          echo "Test reports:"
          ls build/test-results/test || echo "No test results found"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-spring-jar
          path: build/libs/*.jar