server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.main.banner-mode=off

logging.level.org.springframework=INFO
logging.level.com.example.hellospring=DEBUG
# ??????? Hibernate ????? ??????? ???????????
logging.level.org.hibernate.SQL=DEBUG

spring.application.name=hello-spring
# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
# ????????? ???? ??? ????????? ??????????
management.server.port=8081
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=hello-spring
info.app.description=Messages and users: Spring Data JPA, PostgreSQL


# Prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}